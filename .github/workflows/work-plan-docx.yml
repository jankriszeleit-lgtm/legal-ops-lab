name: Work Plan DOCX
on:
  push:
    paths:
      - 'legal-work-planner/releases/2026-11-17/**'
      - '.github/workflows/work-plan-docx.yml'
  pull_request:
    paths:
      - 'legal-work-planner/releases/2026-11-17/**'
      - '.github/workflows/work-plan-docx.yml'
permissions:
  contents: read
jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-docx==1.2.0
      - run: python -m unittest discover -s legal-work-planner/releases/2026-11-17/05_HOST_ADAPTER/tests -v
